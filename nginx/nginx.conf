# --- HTTP: Barcha traffikni HTTPS'ga yo'naltirish ---
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# --- HTTPS: Asosiy server konfiguratsiyasi ---
server {
    listen 443 ssl;
    server_name _;

    client_max_body_size 20M;

    # --- SSL Sertifikat fayllari yo'li (Konteyner ichidagi) ---
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # --- SSL xavfsizlik protokollari ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- iD Editor frontend (static files built by the Docker stage) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Django: OSM API v0.6 protocol endpoints ---
    location /api/ {
        proxy_pass http://django:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Django: OAuth2 (login flow for iD Editor) ---
    location /oauth2/ {
        proxy_pass http://django:8000/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Django: admin panel (map_layers, users, etc.) ---
    location /admin/ {
        proxy_pass http://django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Django: map_layers CRUD API ---
    location /api/map-layers/ {
        proxy_pass http://django:8000/api/map-layers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Django static files (admin CSS/JS, DRF browsable API) ---
    location /static/ {
        alias /static/;
    }

    # --- Martin vector tiles (rewrite /tiles/X -> martin:3000/X) ---
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}