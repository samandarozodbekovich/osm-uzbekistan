# docker-compose.yml
#
# PostgreSQL/PostGIS is NOT a service here - runs natively on the host.
# Docker never touches the database.

services:
  martin:
    image: ghcr.io/maplibre/martin:1.14.0
    container_name: martin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./martin-config.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml"]
    ports:
      - "127.0.0.1:3000:3000"

  django:
    build:
      context: ./osm_api
      dockerfile: Dockerfile
    container_name: osm_django
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"
    command: >
      gunicorn osm_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 120

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: osm_nginx
    restart: unless-stopped
    depends_on:
      - django
      - martin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files:/static:ro

volumes:
  static_files: