# nginx/nginx.conf
#
# IMPORTANT: the location prefixes below (/api/, /oauth/, /admin/, /tiles/)
# are my best guess based on this project's app structure (oauth2_server,
# osm_protocol, map_layers). Check your real osm_backend/urls.py and
# adjust these prefixes to match exactly - a mismatch here means the
# frontend will get 404s from nginx even though Django is running fine.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # --- iD Editor frontend (static files built by the Docker stage) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Django: OSM API v0.6 protocol endpoints ---
    location /api/ {
        proxy_pass http://django:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django: OAuth2 (login flow for iD Editor) ---
    location /oauth2/ {
        proxy_pass http://django:8000/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Django: admin panel (map_layers, users, etc.) ---
    location /admin/ {
        proxy_pass http://django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Django: map_layers CRUD API ---
    location /api/map-layers/ {
        proxy_pass http://django:8000/api/map-layers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Django static files (admin CSS/JS, DRF browsable API) ---
    location /static/ {
        alias /static/;
    }

    # --- Martin vector tiles (rewrite /tiles/X -> martin:3000/X) ---
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}