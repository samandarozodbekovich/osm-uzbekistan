    # ---------------- raw editable OSM data (id_editor) ----------------
    osm_nodes:
      schema: public
      table: osm_nodes
      srid: 4326
      geometry_column: geom
      # 17M+ rows - kept at high zoom on purpose. This table is meant as a
      # raw editing reference inside iD (checking node placement while
      # editing), NOT a public basemap layer. Serving it from a low zoom
      # would generate extremely dense, slow tiles across large areas.
      minzoom: 15
      maxzoom: 22
      bounds: [71.36463165283203, 42.8941764831543, 71.36515045166016, 42.89471435546875]
      geometry_type: POINT
      properties:
        changeset_id: int8
        id: int8
        lat: float8
        lon: float8
        timestamp: timestamptz
        version: int4
        visible: bool

    # osm_basemap olib tashlandi - bu VIEW baza tozalanganda yo'qolgan.
    # Agar kerak bo'lsa, apps/id_editor (OsmWay/OsmNode) ma'lumotidan
    # qayta CREATE VIEW qilinishi mumkin - hozircha shart emas,
    # auto_publish qolgan barcha jadvallarni baribir avtomatik ko'radi.

  functions:
    basemap_tiles:
